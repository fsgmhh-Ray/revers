<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Cineflowing Reverse 助手</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        width: 300px;
        margin: 0;
        padding: 14px 16px 16px;
        background: #0b0d12;
        color: #e2e8f0;
        font: 13px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 14px;
        font-weight: 600;
      }
      .sub {
        margin: 0 0 12px;
        font-size: 11px;
        color: #64748b;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #475569;
        flex: none;
      }
      .dot.on {
        background: #34d399;
      }
      .name {
        flex: 1;
        font-size: 12px;
      }
      .tag {
        font-size: 10.5px;
        color: #64748b;
      }
      a {
        display: block;
        margin-top: 12px;
        color: #7c9cff;
        font-size: 11.5px;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .hint {
        margin-top: 8px;
        font-size: 10.5px;
        line-height: 1.5;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <h1>Cineflowing Reverse 助手</h1>
    <p class="sub">已接管 reverse.cineflowing.com 的解析与下载</p>

    <div id="status">
      <div class="row"><span class="dot" id="d-youtube"></span><span class="name">YouTube</span><span class="tag" id="t-youtube">检测中</span></div>
      <div class="row"><span class="dot" id="d-instagram"></span><span class="name">Instagram</span><span class="tag" id="t-instagram">检测中</span></div>
      <div class="row"><span class="dot" id="d-tiktok"></span><span class="name">TikTok</span><span class="tag" id="t-tiktok">检测中</span></div>
    </div>

    <p class="hint">亮起表示检测到你已登录该平台，解析时会使用你的登录态，成功率最高。</p>
    <a href="https://reverse.cineflowing.com" target="_blank" rel="noreferrer">打开反向工程工坊 →</a>

    <script src="popup.js"></script>
  </body>
</html>
