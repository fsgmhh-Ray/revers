name = "reverse-cineflowing"
compatibility_date = "2024-11-27"
pages_build_output_dir = "dist"

# 非敏感配置可直接写在这里；敏感项请用 Cloudflare Pages 控制台的 Secrets，
# 或本地 .dev.vars（已被 .gitignore 忽略）
[vars]
# 自建 Cobalt / yt-dlp 解析内核地址（推荐，规避 Cloudflare 出口 IP 被 YT/IG 封禁）
# COBALT_INSTANCE_URL = "https://parser-core.yourdomain.com"
# Cobalt v10 的 API Key（Authorization: Api-Key xxx）
# COBALT_API_KEY = ""
# TikTok 兜底解析源（无需自建即可用）
TIKWM_API_URL = "https://www.tikwm.com/api/"
# 所有下载一律由内核代拉（默认已对 YT / IG / 抖音等按域名自动判断）
# FORCE_ORIGIN_PROXY = "1"
# 允许被 proxy-download 中转的额外域名（逗号分隔）
# ALLOWED_DOWNLOAD_HOSTS = ""
# 单文件下载大小上限（字节，0 表示不限制）
MAX_DOWNLOAD_BYTES = "0"
# 演示模式：不接入任何真实解析源时返回示例视频，用于 UI 联调
# MOCK_PARSER = "1"
